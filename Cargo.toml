[workspace]
resolver = "3"
# `tests/*` covers `tests/system`, the cross-provider Postgres+NATS end-to-end package (ADR 0031
# §6) — added in the same change that created that package, per Cargo's rule that a glob must
# match something.
members = ["crates/*", "examples/*", "tests/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"  # ADR 0024 — forced by RUSTSEC-2026-0009 (time >= 0.3.47)
license = "MIT"
repository = "https://github.com/sisaio/sisa-reliar"
authors = ["Sisa"]
homepage = "https://github.com/sisaio/sisa-reliar"
categories = ["asynchronous", "database"]
keywords = ["outbox", "inbox", "idempotency", "messaging", "postgres"]

# One version per dependency; crates inherit with `dep.workspace = true`.
# Reliar's own crates are added here (with `path` + `version`) as they are created.
[workspace.dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
bytes = "1.12"
uuid = { version = "1.26", default-features = false, features = ["v7", "std"] }
# Floor is the RUSTSEC-2026-0009 patch (RFC 2822 parsing stack exhaustion, fixed in 0.3.47).
time = { version = "0.3.47", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
metrics = "0.24"
# Phase 2 (ADR 0031). `jetstream` is the only feature Reliar needs; everything else — a rustls
# crypto provider (`ring`/`aws-lc-rs`), `nkeys`/credentials auth, `websockets`, `kv`,
# `object-store`, `service` — is the **application's** choice and reaches the same compiled
# `async-nats` through feature unification, because the host builds the connection and the
# JetStream `Context` itself (ADR 0029). A library that enables a crypto provider is choosing its
# host's TLS stack. `chrono` stays off, so deny.toml's graph-wide ban is untouched.
async-nats = { version = "0.50", default-features = false, features = ["jetstream"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "time",
  "json",
  "macros",
  "migrate",
] }

# testcontainers-modules 0.15 requires testcontainers ^0.27 (checked against crates.io); keep the
# two in lockstep or `cargo metadata` fails workspace-wide.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# The one-binary-per-provider test harness (RELIAR-27, ADR 0031 §4/§6): `harness = false` +
# `libtest-mimic` so each provider's `main` owns its shared container(s) as locals and drops them
# explicitly before returning, rather than via `Conclusion::exit()`'s `process::exit`.
libtest-mimic = "0.8"
criterion = "0.8"
proptest = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# `examples/` only — library crates never depend on either (house style, `team/engineering-conventions.md` §1).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
anyhow = "1"
# `examples/nats-pub-sub` only, for `async_nats::Subscriber`'s `Stream` impl (`StreamExt::next`) —
# the lean sub-crate is enough, no example needs the wider `futures` facade.
futures-util = "0.3"

reliar-core = { path = "crates/reliar-core", version = "0.2.0", default-features = false }
reliar-outbox = { path = "crates/reliar-outbox", version = "0.2.0" }
reliar-store-postgres = { path = "crates/reliar-store-postgres", version = "0.2.0" }
reliar-transport-nats = { path = "crates/reliar-transport-nats", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The library must never take a host process down; return errors instead.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
opt-level = 0
debug = true

# Optimize dependencies once so the inner loop (sqlx macros, testcontainers) stays fast.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
inherits = "dev"
opt-level = 1

# Profiles apply to builds *in this workspace* (benches, examples, the test binaries) only —
# a downstream application's own profile governs how Reliar is compiled into it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Line tables, not stripped: benchmark and example backtraces stay readable, and the size cost
# does not reach any published artifact.
debug = "line-tables-only"
strip = "none"
# Documents the intent — a library must never force `abort` on its hosts. Cargo ignores this for
# a dependency, so the crates additionally avoid panicking paths (see [workspace.lints.clippy]).
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
