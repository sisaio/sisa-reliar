name: reliar-dev

# Local infrastructure for running the examples and for manual exploration.
# It is deliberately NOT the database the tests use: SRS §8.2 forbids testing against a shared or
# long-lived database, so provider tests boot their own ephemeral container via testcontainers.

services:
  postgres:
    # This tag, the NATS one and the PgDog one below are kept equal to the tests' pins (and to
    # test.yaml's) by ci.yaml's "compose and the tests pin the same images" step — bump
    # them together.
    image: postgres:18-alpine
    env_file: [configs/postgres.env]
    secrets: [postgres_password]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      # PostgreSQL 18 images moved PGDATA to /var/lib/postgresql/<major>/docker, so the persistent
      # mount point is the parent directory now; mounting at /var/lib/postgresql/data makes the
      # entrypoint fail on first start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliar -d reliar"]
      interval: 5s
      timeout: 5s
      retries: 10

  # JetStream server for the Phase-2 transport (ADR 0031). Kept equal to the transport tests' pin
  # by the same ci.yaml step as the images above.
  #
  # `-js` is required: the image's default command starts nats-server from
  # /etc/nats/nats-server.conf, which has JetStream **off** — and every Reliar publish awaits a
  # JetStream ack (ADR 0028), so a server without it fails on the first message. `-m 8222` turns
  # on the monitoring endpoint the healthcheck needs.
  nats:
    image: nats:2.14-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      # Monitoring, for humans: http://127.0.0.1:8222/jsz?config=1 and /varz.
      - "127.0.0.1:8222:8222"
    healthcheck:
      # A real JetStream probe. The obvious ones are vacuous, verified against this exact image:
      # /healthz, /healthz?js-enabled-only=true and /healthz?js-server-only=true all answer
      # {"status":"ok"} on a server started *without* `-js`. /jsz reports "disabled": true and
      # omits store_dir in that case, so grepping for store_dir fails both when the server is
      # down and when it is up without JetStream — which is the only kind of healthcheck worth
      # writing (same lesson as the PgDog probe below).
      test: ["CMD-SHELL", "wget -q -O- 'http://127.0.0.1:8222/jsz?config=1' | grep -q store_dir"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No volume on purpose: JetStream storage stays inside the container, so a stream created by
    # hand cannot survive a `down`/`up` and quietly change what the next example or test sees.

  # Transaction-mode pooler, for reproducing the pooler behaviour of decision #28 by hand.
  # Decision #31: the pooler is **PgDog** — the same image and tag the provider's pooler scenario
  # runs (crates/reliar-store-postgres/tests/postgres/outbox_pgdog.rs, kept equal by the ci.yaml
  # step named above), so what you reproduce here is what CI asserts. Bring it up with:
  #
  #   RELIAR_PG_PASSWORD=$(cat deploy/compose/secrets/postgres_password) \
  #     docker compose -f deploy/compose/docker-compose.yaml --profile pooler up -d --wait
  #
  # This PgDog build passes the startup `options` parameter through to the upstream server, so the
  # URL-`options` search_path works behind it unmodified. Any transaction-mode pooler that drops
  # those options instead needs the server-side default — `ALTER ROLE reliar SET search_path =
  # reliar, public` — which is the portable mechanism and is what the guide recommends verifying
  # against your own pooler build.
  pgdog:
    image: ghcr.io/pgdogdev/pgdog:v0.1.46
    profiles: [pooler]
    depends_on:
      postgres: {condition: service_healthy}
    configs:
      - source: pgdog_config
        target: /pgdog/pgdog.toml
      - source: pgdog_users
        target: /pgdog/users.toml
    ports: ["127.0.0.1:6432:6432"]
    environment:
      # For the healthcheck's own client connection. The same secret already sits in this
      # container's `users.toml`, so this adds no exposure.
      PGPASSWORD: "${RELIAR_PG_PASSWORD:-}"
    healthcheck:
      # A real query through the pooler, because the cheaper probes are both vacuous here:
      # `pgdog --version` only proves the binary exists, and `pg_isready -p 6432` answers
      # "accepting connections" even when PgDog has *disabled the pool* for a missing password —
      # so with an empty `RELIAR_PG_PASSWORD` the stack came up "healthy" and failed on first use.
      # `select 1` covers client auth and the upstream connection together; with no password set
      # the container stays unhealthy, `up --wait` fails, and `docker logs reliar-dev-pgdog-1`
      # shows PgDog's `disabling pool for user "reliar" … password not set`.
      test: ["CMD-SHELL", "psql -w -h 127.0.0.1 -p 6432 -U reliar -d reliar -tAc 'select 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

configs:
  pgdog_config:
    file: ./configs/pgdog.toml
  # Generated by compose rather than committed: this is the one PgDog file that carries the
  # upstream password, and `configs/pgdog.toml` deliberately does not. The default is empty rather
  # than a `:?` guard, which compose evaluates even when this service's profile is not selected.
  pgdog_users:
    content: |
      [[users]]
      name = "reliar"
      database = "reliar"
      password = "${RELIAR_PG_PASSWORD:-}"

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres-data:
