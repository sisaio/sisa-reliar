[package]
name = "reliar-migrate"
version = "0.0.0"
publish = false
edition.workspace = true
# ADR 0025: this binary links `reliar-store-postgres`, so it inherits sqlx 0.9's floor. Declared
# rather than inherited, because the computed MSRV gate (scripts/msrv-exclusions.py) fails a member
# that depends on an above-floor package without declaring one of its own.
rust-version = "1.94"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reliar-store-postgres = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
