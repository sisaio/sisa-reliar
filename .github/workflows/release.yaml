name: release

on:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  # release-plz tags, creates the GitHub release, and publishes in dependency order
  # (reliar-core → reliar-outbox → reliar-store-postgres → reliar-transport-nats), waiting for the
  # index between crates. It does **not** decide version numbers: ADR 0034 gives those to the pull
  # request that changes the crate, and `ci.yaml`'s `versioning` job proves the bump happened
  # before the merge. `release-plz.toml` records the configuration; `main` is publishable at every
  # commit, so this job is a publish, never a decision.
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    permissions:
      # Tags and GitHub releases only. `pull-requests: write` went with the `release-pr` command
      # this job no longer runs (ADR 0034 §5).
      contents: write
    outputs:
      releases: ${{ steps.release.outputs.releases }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # There is deliberately no `release-pr` step (ADR 0034 §5): two owners for a version number
      # is how a bump gets forgotten, and that is precisely what broke the first Phase-2 release —
      # `release` and `release-pr` were two steps of one job with `release` first, so the failed
      # publish also cancelled the pull request that would have proposed the missing bump.

  # The migrations embedded in the crate stay the source of truth; this asset only serves teams
  # that run migrations through their own pipeline. Guarded until the provider crate exists.
  migration-artifact:
    name: migration scripts
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: package migrations
        id: package
        run: |
          set -euo pipefail
          crate_dir=crates/reliar-store-postgres
          if [ ! -d "$crate_dir/migrations" ]; then
            echo "no migrations to publish yet — skipping"
            echo "packaged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(printf '%s' "$metadata" \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="reliar-store-postgres"))')
          archive="reliar-store-postgres-migrations-${version}.tar.gz"
          (cd "$crate_dir/migrations" && sha256sum ./*.sql > SHA256SUMS)
          tar -czf "$archive" -C "$crate_dir" migrations
          {
            echo "packaged=true"
            echo "archive=$archive"
            echo "tag=reliar-store-postgres-v${version}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        if: steps.package.outputs.packaged == 'true'
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: upload to the release
        if: steps.package.outputs.packaged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.package.outputs.tag }}" "${{ steps.package.outputs.archive }}" --clobber
