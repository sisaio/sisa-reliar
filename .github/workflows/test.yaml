name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # Every build in this workflow compiles the sqlx macros against the committed .sqlx cache.
  # Only the `prepare --check` step below turns this off, because that step's whole job is to
  # compare the cache against a live database.
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: tests + coverage (postgres ${{ matrix.postgres_tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SRS §11/§43.A.34: the minimum supported PostgreSQL is 18, and the suite also runs
        # against the newest major available. As of this workflow, 18 *is* the newest published
        # major on Docker Hub (verified against the registry) — the matrix has one entry rather
        # than a fabricated second one. Add "19-alpine" (or whatever the next major's tag is)
        # here the day it ships; no other change to this job is needed.
        postgres_tag: ["18-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres_tag }}
        env:
          POSTGRES_USER: reliar
          POSTGRES_PASSWORD: reliar
          POSTGRES_DB: reliar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reliar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # SRS §8.2 lets CI substitute a service container for the testcontainers-managed one.
      # Locally there is no DATABASE_URL and every provider test boots its own container.
      # Identical to the sqlx job's DSN — decision #28 resolves Reliar's tables through the
      # connection's search_path, so a DSN without it exercises a different schema than the code.
      DATABASE_URL: postgres://reliar:reliar@localhost:5432/reliar?options=-c%20search_path%3Dreliar,public
      # Same substitution for the Phase-2 transport tests: with NATS_URL set they use the server
      # started below; without it (a local run) each test binary boots its own container
      # (ADR 0031 §4).
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v7
      # NATS is a **step**, not a service container, and that is not an oversight: a service
      # container accepts only image/env/ports/volumes/options — it cannot override the image's
      # CMD — and `nats`'s default command starts nats-server from /etc/nats/nats-server.conf
      # with JetStream **off**. Every Reliar publish awaits a JetStream ack (ADR 0028), so a
      # `nats` service container is incapable of serving this suite. ADR 0031 §3.
      #
      # The readiness probe asserts the same fact compose's healthcheck does — `/jsz?config=1`
      # reports a `store_dir` — through curl rather than compose's wget, because that is what the
      # runner has and the container is probed from outside. The endpoint is the point:
      # /healthz answers {"status":"ok"} even with JetStream disabled (verified against this
      # image), while /jsz omits store_dir. No cleanup step: the runner is discarded with the job,
      # which is also why there is no `--rm` — the logs must outlive a failed test step (see the
      # dump below). On a self-hosted runner the fixed `--name` would collide with a leftover
      # container from an earlier job; this job assumes the ephemeral GitHub-hosted runner.
      #
      # Starting the container and waiting for it are two steps on purpose. `docker run -d`
      # returns as soon as the container is created, so the server boots *while* the toolchain
      # installs and the cache restores; the readiness loop then runs after that work and almost
      # always passes on its first poll. A single step here would have blocked the job on a
      # 30-poll loop before a single byte of Rust was fetched.
      - name: start a JetStream server
        run: |
          set -euo pipefail
          docker run -d --name reliar-nats -p 4222:4222 -p 8222:8222 \
            nats:2.14-alpine -js -m 8222
      # rust-toolchain.toml pins the channel for every cargo call, and llvm-tools-preview lives
      # there for cargo-llvm-cov; installing `stable` here would be silently overridden, so the
      # pinned toolchain is installed deliberately instead.
      - name: install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wait for JetStream to serve
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8222/jsz?config=1' | grep -q store_dir; then
              echo "JetStream is serving"
              exit 0
            fi
            sleep 1
          done
          echo "::error::NATS did not become ready with JetStream enabled"
          docker logs reliar-nats || true
          exit 1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Keyed on the **provider crate**, which is what actually has to exist for a migration to
      # be meaningful — and which now owns the migration entry point itself, as
      # `crates/reliar-store-postgres/examples/migrate.rs`. It
      # used to key on a `reliar-migrate` package that had never been created, so the probe was
      # permanently false, the migration silently never ran, and the job stayed green while
      # proving nothing. A skip-guard whose condition can never be true is worse than no guard:
      # it reports success.
      - name: does the Postgres provider exist yet
        id: probe
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          if printf '%s' "$metadata" | grep -q '"name":"reliar-store-postgres"'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "reliar-store-postgres does not exist yet — skipping the migration"
          fi
      # Provider tests run against the service container, so its schema has to exist before
      # cargo llvm-cov starts the test binaries.
      - name: migrate a fresh database
        if: steps.probe.outputs.exists == 'true'
        run: cargo run -p reliar-store-postgres --example migrate
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      # A NATS test failure is usually a server-side story (a stream rejected, JetStream not
      # serving, the connection dropped) and the transport crate deliberately logs no broker
      # `Display` (ADR 0030 Amendment B), so the server's own log is the only place that
      # evidence exists. Only on failure, and never fatal itself.
      - name: nats server log
        if: failure()
        run: docker logs reliar-nats || true

  sqlx-offline-cache:
    name: sqlx offline cache is current
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: reliar
          POSTGRES_PASSWORD: reliar
          POSTGRES_DB: reliar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reliar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://reliar:reliar@localhost:5432/reliar?options=-c%20search_path%3Dreliar,public
    steps:
      - uses: actions/checkout@v7
      - name: install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Keyed on the provider crate alone. The previous `&&` with a `reliar-migrate` package that
      # did not exist made this probe permanently false, so the sqlx-cli install, the migration
      # and `cargo sqlx prepare --check` were all skipped and the Definition-of-Done gate went
      # unenforced while the job reported success.
      - name: does the provider crate exist yet
        id: probe
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          if printf '%s' "$metadata" | grep -q '"name":"reliar-store-postgres"'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "reliar-store-postgres does not exist yet — skipping"
          fi
      - uses: taiki-e/install-action@v2
        if: steps.probe.outputs.exists == 'true'
        with:
          tool: sqlx-cli
      # Order matters: the schema must exist before any query macro is verified against it.
      # The `migrate` example calls the provider's public migrate() API and contains no query
      # macros of its own, so it builds from the committed offline cache (SQLX_OFFLINE is set
      # above) — which is also a smoke test that the cache is current enough to build the provider.
      - name: migrate a fresh database
        if: steps.probe.outputs.exists == 'true'
        run: cargo run -p reliar-store-postgres --example migrate
      - name: cargo sqlx prepare --check
        if: steps.probe.outputs.exists == 'true'
        working-directory: crates/reliar-store-postgres
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --check -- --all-targets --all-features
