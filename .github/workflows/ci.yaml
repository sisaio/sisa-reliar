name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  conventions:
    name: repository conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Decision #22 / SRS §43.B: every YAML file uses the .yaml extension.
      #
      # Exactly one exception, whitelisted by full path: `.github/dependabot.yml`. GitHub's
      # documentation gives the config path as `.github/dependabot.yml` on every page that names
      # it and never mentions `.yaml` (verified 2026-09-04, RELIAR-21). A `.yaml` file there is
      # not rejected — it is silently ignored, so Dependabot simply never runs and the action
      # version tags and the cargo tree quietly stop being updated. A silent security-update failure is
      # not worth one spelling. ADR 0022 carries the reasoning; the whitelist is an exact path so
      # a second `.yml` cannot appear beside it.
      - name: no .yml files
        run: |
          set -euo pipefail
          if files=$(git ls-files '*.yml' | grep -v '^\.github/dependabot\.yml$') && [ -n "$files" ]; then
            echo "::error::.yml is banned, use .yaml: $files"
            exit 1
          fi
      # Skill rust-lib-testing: crates test their public API from tests/, never inline.
      # POSIX ERE only — `git grep -E` has no `\s`, so an indented `#[cfg(test)]` slipped through
      # the previous pattern. `(test|all\(test)` also catches `#[cfg(all(test, feature = ...))]`.
      - name: no inline #[cfg(test)] modules under src/
        run: |
          set -euo pipefail
          if files=$(git grep -l -E '^[[:space:]]*#\[cfg\((test|all\(test)' -- '*/src/*.rs' 'src/*.rs') && [ -n "$files" ]; then
            echo "::error::inline #[cfg(test)] found; move tests to the crate's tests/ directory: $files"
            exit 1
          fi
      # engineering-conventions §3/§4 + ADR 0022. These are *house style* rules about our own
      # source, so they are enforced per-manifest here rather than as a `cargo deny` ban: deny's
      # bans are graph-wide, and sqlx-core legitimately depends on thiserror. Scoped to crates/*
      # on purpose — anyhow is allowed in examples/ (ADR 0022, deny.toml).
      - name: no house-banned crates in library manifests
        run: |
          set -euo pipefail
          banned='^[[:space:]]*(async-trait|async_trait|thiserror|anyhow|chrono)[[:space:]]*(=|\.)'
          if hits=$(git grep -n -E "$banned" -- 'crates/*/Cargo.toml') && [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a library crate declares a banned dependency; see engineering-conventions §3/§4"
            exit 1
          fi
      # Decision #31: the compose `pooler` profile runs the same PgDog the provider's pooler
      # scenario runs, and the provider tests the same PostgreSQL major the compose stack runs —
      # reproducing a CI failure by hand is only worth something if the substrate matches. Rust
      # needs the image and tag as `const`s and compose needs them in `image:`; neither file can
      # read the other (an `include_str!` reaching outside the crate directory would not survive
      # `cargo package`), so the pins stay literal in both and this step is what keeps them equal.
      - name: compose and the tests pin the same images
        env:
          # This job installs no toolchain and asks `cargo metadata` for nothing but package
          # names; stable is preinstalled on the runner, while rust-toolchain.toml's pinned
          # channel would make the first cargo call download a whole toolchain to read them.
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          compose=deploy/compose/docker-compose.yaml
          scenario=crates/reliar-store-postgres/tests/postgres/outbox_pgdog.rs
          harness=crates/reliar-transport-nats/tests/nats/main.rs
          e2e=tests/system/tests/e2e/main.rs
          need() { [ -n "$1" ] || { echo "::error::$2"; exit 1; }; }
          # Every Rust pin is a bare `const NAME: &str = "value";` at column 0 — the shape all
          # three files use, and the only shape this reads.
          konst() { sed -n "s|^const $1: &str = \"\(.*\)\";$|\1|p" "$2" 2>/dev/null || true; }
          # The per-package comparisons below are keyed on the **package existing**, never on a
          # file or a directory: a renamed or moved harness has to fail this job, not silently
          # stop being compared. A guard that can quietly stop guarding is worse than no guard
          # (ADR 0025 §4 learned this twice).
          metadata=$(cargo metadata --no-deps --format-version 1)
          member() { printf '%s' "$metadata" | grep -q "\"name\":\"$1\""; }

          compose_pgdog=$(sed -n 's|^[[:space:]]*image: \(ghcr\.io/pgdogdev/pgdog:.*\)$|\1|p' "$compose")
          test_image=$(sed -n 's|^const PGDOG_IMAGE: &str = "\(.*\)";$|\1|p' "$scenario")
          test_tag=$(sed -n 's|^const PGDOG_TAG: &str = "\(.*\)";$|\1|p' "$scenario")
          need "$compose_pgdog" "no ghcr.io/pgdogdev/pgdog image found in $compose"
          need "$test_image" "no PGDOG_IMAGE const found in $scenario"
          need "$test_tag" "no PGDOG_TAG const found in $scenario"
          if [ "$compose_pgdog" != "$test_image:$test_tag" ]; then
            echo "::error::PgDog pin drifted: $compose has '$compose_pgdog', $scenario has '$test_image:$test_tag'"
            exit 1
          fi

          compose_pg=$(sed -n 's|^[[:space:]]*image: postgres:\(.*\)$|\1|p' "$compose")
          test_pg=$(git grep -hoE '\.with_tag\("[^"]+"\)' -- 'crates/reliar-store-postgres/tests/*' | sed 's|.*("\(.*\)")|\1|' | sort -u)
          need "$compose_pg" "no postgres image found in $compose"
          need "$test_pg" "no .with_tag(...) found in the provider tests"
          if [ "$compose_pg" != "$test_pg" ]; then
            echo "::error::PostgreSQL tag drifted: $compose has '$compose_pg', the provider tests have '$test_pg'"
            exit 1
          fi
          # The matrix may be a superset (a second major the day one ships), but compose's major
          # has to be in it or the stack a contributor runs is a major CI never tested.
          if ! grep -q "\"$compose_pg\"" .github/workflows/test.yaml; then
            echo "::error::test.yaml's postgres_tag matrix does not cover compose's '$compose_pg'"
            exit 1
          fi
          # The cross-provider e2e package pins Postgres as a const of its own (it starts the
          # container itself, so it cannot reuse the provider crate's `.with_tag`).
          if member reliar-system-tests; then
            e2e_pg=$(konst POSTGRES_TAG "$e2e")
            need "$e2e_pg" "no POSTGRES_TAG const found in $e2e (contract phase2 §7)"
            if [ "$compose_pg" != "$e2e_pg" ]; then
              echo "::error::PostgreSQL tag drifted: $compose has '$compose_pg', $e2e has '$e2e_pg'"
              exit 1
            fi
          else
            echo "reliar-system-tests does not exist yet — tests/system not compared"
          fi
          # NATS (ADR 0031). **Five** places pin it, two of them Rust consts: compose's `nats:`
          # image, test.yaml's `docker run` step (a service container cannot enable JetStream —
          # ADR 0031 §3), the transport crate's test harness, the `tests/system` e2e harness, and
          # CONTRIBUTING.md's prose. All five are compared here.
          compose_nats=$(sed -n 's|^[[:space:]]*image: \(nats:.*\)$|\1|p' "$compose")
          # `nats:[0-9]` on purpose: it matches the image reference and not `nats://` in NATS_URL.
          ci_nats=$(grep -hoE 'nats:[0-9][^ ]*' .github/workflows/test.yaml | sort -u)
          need "$compose_nats" "no nats image found in $compose"
          need "$ci_nats" "no nats image found in .github/workflows/test.yaml"
          if [ "$compose_nats" != "$ci_nats" ]; then
            echo "::error::NATS pin drifted: $compose has '$compose_nats', test.yaml has '$ci_nats'"
            exit 1
          fi
          for pkg_file in "reliar-transport-nats:$harness" "reliar-system-tests:$e2e"; do
            pkg=${pkg_file%%:*}
            file=${pkg_file#*:}
            if ! member "$pkg"; then
              echo "$pkg does not exist yet — $file not compared"
              continue
            fi
            nats_image=$(konst NATS_IMAGE "$file")
            nats_tag=$(konst NATS_TAG "$file")
            need "$nats_image" "no NATS_IMAGE const found in $file (contract phase2 §7)"
            need "$nats_tag" "no NATS_TAG const found in $file (contract phase2 §7)"
            if [ "$compose_nats" != "$nats_image:$nats_tag" ]; then
              echo "::error::NATS pin drifted: $compose has '$compose_nats', $file has '$nats_image:$nats_tag'"
              exit 1
            fi
          done
          # CONTRIBUTING.md names the image in prose, for humans. Drift-only on purpose: dropping
          # the mention is a documentation edit and passes, naming a *different* image does not.
          doc_nats=$(grep -hoE 'nats:[0-9][^ `)]*' CONTRIBUTING.md | sort -u || true)
          if [ -n "$doc_nats" ] && [ "$doc_nats" != "$compose_nats" ]; then
            echo "::error::NATS pin drifted: $compose has '$compose_nats', CONTRIBUTING.md has '$doc_nats'"
            exit 1
          fi

          echo "pinned: $compose_pgdog · postgres:$compose_pg · $compose_nats"

  check:
    name: fmt · clippy · doc · features
    runs-on: ubuntu-latest
    env:
      # The pinned toolchain is what contributors run; this job additionally proves the workspace
      # builds on current stable, which is where new lints appear first.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-machete
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - run: cargo machete

  purity:
    name: pure crates stay pure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The dependency rule (skill rust-library-design, conventions §2) is a hard gate: every
      # crate named in `pure` below must exist and must be checked — a missing one fails the job
      # rather than being skipped, and the count is asserted at the end so this step cannot
      # report success having checked nothing. --prefix none prints one bare
      # `name vX.Y.Z` per line, so the pattern anchors on the package name and cannot match a
      # path or a feature string.
      #
      # `reliar-outbox` is checked alongside `reliar-core` since Phase 2: §43.B requires that
      # adding a transport touches nothing in the outbox, and a provider dependency creeping into
      # the abstraction crate is exactly the failure that constraint exists to catch. Add
      # `-inbox` / `-idempotency` to `pure` when they land.
      - name: no infrastructure crates in the pure crates
        run: |
          set -euo pipefail
          # Each cargo call is assigned before it is piped: inside an `if` condition `set -e` is
          # suspended and `pipefail` only reshapes the status the `if` swallows, so a broken
          # `cargo metadata`/`cargo tree` would otherwise be read as "clean" and pass the gate.
          metadata=$(cargo metadata --no-deps --format-version 1)
          banned='^(sqlx|sqlx-core|sqlx-postgres|sqlx-macros|postgres|tokio-postgres|async-nats|nats|rdkafka|lapin|redis|deadpool-redis) '
          pure=(reliar-core reliar-outbox)
          checked=0
          for crate in "${pure[@]}"; do
            if ! printf '%s' "$metadata" | grep -q "\"name\":\"$crate\""; then
              echo "::error::$crate is listed as a pure crate but is not a workspace member"
              exit 1
            fi
            checked=$((checked + 1))
            tree=$(cargo tree -p "$crate" -e normal --all-features --prefix none)
            if printf '%s\n' "$tree" | sort -u | grep -E "$banned"; then
              echo "::error::$crate depends on an infrastructure crate (listed above)"
              exit 1
            fi
            echo "$crate is clean"
          done
          if [ "$checked" -ne "${#pure[@]}" ]; then
            echo "::error::expected ${#pure[@]} pure crates to be checked, checked $checked"
            exit 1
          fi
          echo "pure crates checked: $checked"
      # ADR 0031 §6: providers never depend on each other, in either direction and in **any**
      # dependency kind — a dev-dependency is still a manifest dependency, still resolved at
      # publish time, and still drags sqlx into the transport crate's build. That rule is the
      # whole justification for `tests/system` existing as its own package, and until now nothing
      # enforced it: a `reliar-store-postgres` dev-dep inside `reliar-transport-nats` passed every
      # job. `cargo metadata --no-deps` lists exactly the workspace members' own declared
      # dependencies with their `kind` (null = normal, "dev", "build"), which is precisely the
      # manifest-level statement this rule is about.
      - name: no provider depends on another provider
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          violations=$(printf '%s' "$metadata" | jq -r '
            .packages[] as $p
            | $p.dependencies[]
            | select(($p.name | test("^reliar-(store|transport)-"))
                     and (.name | test("^reliar-(store|transport)-"))
                     and (.name != $p.name))
            | "  \($p.name) -> \(.name) (\(.kind // "normal") dependency)"
          ')
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::a provider crate depends on another provider crate; conventions §2 and ADR 0031 §6 forbid it in every dependency kind — a cross-provider test belongs in tests/system"
            exit 1
          fi
          echo "no provider-on-provider dependency"
      # ADR 0032: a provider depends on `reliar-core` directly, and on an abstraction crate
      # (`reliar-outbox`, later `-inbox`/`-idempotency`) **only when it implements a trait that
      # crate owns**. `reliar-store-postgres` implements `OutboxStore`, so its `reliar-outbox`
      # edge is correct and stays. `reliar-transport-nats` implements only `reliar-core` traits
      # (`Publisher`, `EnvelopeMapper`) since ADR 0032 moved `Publisher`/`Classify`/`FailureKind`/
      # `SettingsError` into core, so `reliar-core` is the only Reliar dependency it may declare —
      # in **any** kind, because a dev-dependency would compile the whole outbox (records, leases,
      # the dispatcher) into a transport's test build and would be the edge that quietly grows
      # back. Nothing enforced this, and a re-added `use reliar_outbox::Publisher` plus a manifest
      # line would have passed every other job.
      #
      # The allow-list is per crate and explicit: a new transport adds one line, and the entry is
      # the argument for why that edge exists. The membership probe means the gate cannot pass by
      # the crate having disappeared.
      - name: a transport declares only the abstraction crates it implements
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          # "<package>:<space-separated reliar deps it may declare, in any kind>"
          allowed=(
            "reliar-transport-nats:reliar-core"
            "reliar-store-postgres:reliar-core reliar-outbox"
          )
          checked=0
          for entry in "${allowed[@]}"; do
            pkg=${entry%%:*}
            permitted=" ${entry#*:} "
            if ! printf '%s' "$metadata" | jq -e --arg p "$pkg" \
                 '[.packages[] | select(.name == $p)] | length == 1' >/dev/null; then
              echo "::error::$pkg is listed here but is not a workspace member"
              exit 1
            fi
            checked=$((checked + 1))
            declared=$(printf '%s' "$metadata" | jq -r --arg p "$pkg" '
              .packages[] | select(.name == $p) | .dependencies[]
              | select(.name | startswith("reliar-"))
              | "\(.name) \(.kind // "normal")"
            ')
            violations=""
            while read -r name kind; do
              [ -n "$name" ] || continue
              case "$permitted" in
                *" $name "*) ;;
                *) violations="$violations  $pkg -> $name ($kind dependency)"$'\n' ;;
              esac
            done <<< "$declared"
            if [ -n "$violations" ]; then
              printf '%s' "$violations"
              echo "::error::$pkg may declare only [${entry#*:} ] as Reliar dependencies (ADR 0032, conventions §2); an abstraction crate it implements nothing from does not belong in its manifest, in any dependency kind"
              exit 1
            fi
            echo "$pkg declares only: ${entry#*:}"
          done
          if [ "$checked" -ne "${#allowed[@]}" ]; then
            echo "::error::expected ${#allowed[@]} provider manifests to be checked, checked $checked"
            exit 1
          fi
          echo "provider manifests checked: $checked"

  msrv:
    name: msrv 1.88
    runs-on: ubuntu-latest
    env:
      # One place: the toolchain installed below and the floor the exclusion list is computed
      # against. ADR 0024 — 1.88 is the floor RUSTSEC-2026-0009 forced, since every patched
      # `time` needs it.
      MSRV: "1.88"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      # `+$MSRV` is required: rust-toolchain.toml otherwise pins every cargo invocation.
      #
      # ADR 0025 lets a provider crate declare its driver's MSRV (sqlx 0.9 needs 1.94) while the
      # workspace floor stays lower (ADR 0024). Those packages cannot build on the floor
      # toolchain, so this job excludes them; the `check` job covers them on the pinned toolchain
      # instead — the exclusion narrows *which* toolchain covers them, never *whether*.
      #
      # The list is computed, never hard-coded: a hard-coded `--exclude reliar-store-postgres`
      # left `examples/axum-outbox` — which merely depends on it — in the build, and the job
      # failed. `cargo --exclude` only skips building a package as a *root*; a package is still
      # built when an included member depends on it. So the dependent check below is not a
      # nicety, it is what makes the exclusion sound: a member that depends on an above-floor
      # package without declaring its own `rust-version` can neither build on the floor toolchain
      # nor be excluded from it, and is an ADR-0025 error.
      #
      - name: check on the MSRV toolchain
        run: |
          set -euo pipefail

          # Versions are padded to exactly three components before they are compared. Without the
          # padding jq compares the arrays by prefix, so [1,88,0] > [1,88] and a package declaring
          # "1.88.0" against a floor written "1.88" reads as *above* the floor — which would
          # exclude every member and leave this job green having built nothing. A gate that passes
          # by building nothing is worse than no gate, and that failure is silent, so it is
          # asserted before it is relied on.
          pad='def pad: (split(".") | map(tonumber)) + [0, 0] | .[0:3];'
          if [ "$(jq -nr --arg msrv "$MSRV" "$pad (\$msrv | pad) == (\$msrv + \".0\" | pad)")" != "true" ]; then
            echo "::error::MSRV version padding is broken; the exclusion list cannot be trusted"
            exit 1
          fi

          # Assigned before the pipe: inside a pipeline `set -e` does not stop a failing
          # `cargo metadata`, and the ADR-0025 error below must fail the job.
          metadata=$(cargo metadata --no-deps --format-version 1)

          # `.kind` is null for a normal dependency and "build" for a build one; `cargo check`
          # without --all-targets builds neither dev-dependencies nor their graph, so those are
          # not a problem here.
          problems=$(printf '%s' "$metadata" | jq -r --arg msrv "$MSRV" "$pad"'
            [.packages[] | select(((.rust_version // $msrv) | pad) > ($msrv | pad)) | .name] as $above
            | [.packages[].name] as $members
            | .packages[]
            | select(.name as $n | ($above | index($n)) == null)
            | . as $pkg
            | .dependencies[]
            | select(.kind == null or .kind == "build")
            | select(.name as $d | ($members | index($d)) != null and ($above | index($d)) != null)
            | "\($pkg.name) depends on \(.name), which declares an MSRV above the workspace floor \($msrv), but \($pkg.name) declares no rust-version of its own. It can neither build on the MSRV toolchain nor be excluded from it. Declare rust-version on \($pkg.name) (ADR 0025)."')
          if [ -n "$problems" ]; then
            while IFS= read -r problem; do echo "::error::$problem"; done <<< "$problems"
            exit 1
          fi

          exclusions=$(printf '%s' "$metadata" | jq -r --arg msrv "$MSRV" "$pad"'
            [.packages[] | select(((.rust_version // $msrv) | pad) > ($msrv | pad)) | .name] | sort | .[]')

          # An array rather than unquoted word splitting: a package name never contains a space
          # today, but relying on IFS to build an argument list breaks silently rather than loudly.
          args=()
          while IFS= read -r name; do
            # An `if`, not `[ -n .. ] && ..`: under `set -e` the `&&` form exits the job on the
            # single empty line `<<<` produces when there is nothing to exclude — which is the
            # normal state once the workspace floor catches up with its providers.
            if [ -n "$name" ]; then
              echo "excluding $name (ADR 0025)"
              args+=(--exclude "$name")
            fi
          done <<< "$exclusions"

          cargo +"$MSRV" check --workspace --all-features "${args[@]}"

  # ADR 0034. Phase 2 merged with `reliar-core` still at the version it had on crates.io while its
  # public surface had changed (ADR 0032 moved `Publisher`/`Classify`/`FailureKind`/`SettingsError`
  # into it), so the `release` job packaged `reliar-transport-nats` against the *registry's*
  # `reliar-core` 0.1.0 and failed with four `unresolved import`s. Nothing on the pull request could
  # have caught it: inside the workspace every Reliar dependency resolves through `path`, and
  # `cargo package --workspace` — since Cargo 1.83 — packages the members together and resolves
  # siblings to the freshly packaged local copies, so it passes on exactly the tree that fails to
  # publish (verified on cargo 1.98). Only `cargo package -p <crate>` reaches the registry, and that
  # form cannot be a gate: during any release the dependency's new version is by definition not yet
  # published, so it fails with `failed to select a version for the requirement`.
  #
  # What is checkable on a pull request is the invariant underneath: **a version that is on
  # crates.io is frozen**. If a crate's manifest version is already published, its directory must be
  # byte-identical to the tag that published it; otherwise that version number names two different
  # crates and the next publish of anything depending on it breaks. `cargo semver-checks` then says
  # how big the bump has to be — it finds *breaking* differences, which additive ones (core's, here)
  # are not, so the freeze check is the load-bearing half and semver-checks is the second half.
  versioning:
    name: published versions are frozen
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      # Deliberately empty for this job only: `cargo semver-checks` compiles the *published*
      # baseline crate and generates rustdoc JSON from it. That crate is immutable and may warn
      # under a newer toolchain; a warning in a release that already shipped is not this pull
      # request's to fix, and `-D warnings` would turn it into a failure with no possible fix.
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The freeze check compares against release tags and checks out a second worktree at
          # one, so it needs the tags and the history behind them — the default shallow, tagless
          # checkout would silently have nothing to compare and this gate would pass by doing
          # nothing. `fetch-depth: 0` fetches tags too; `fetch-tags` is only needed when the
          # checkout is shallow.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: a published version is frozen
        run: |
          set -euo pipefail
          # crates.io answers 403 without a User-Agent that identifies the caller.
          ua="sisa-reliar-ci (+https://github.com/sisaio/sisa-reliar)"
          baselines="$RUNNER_TEMP/semver-baselines.tsv"
          : > "$baselines"

          # A crate's directory is only half of what `cargo publish` uploads. `[workspace.package]`,
          # `[workspace.dependencies]` and `[workspace.lints]` are inherited from the **root**
          # manifest and baked into the generated `Cargo.toml`, so a root edit can change a
          # published crate's effective manifest — a dependency requirement, `rust-version`,
          # `edition`, a lint level — while its directory stays byte-identical to the release tag.
          # Diffing the root manifest wholesale would be the wrong fix: it would force a bump of
          # every published crate on any root edit, including one touching an examples-only
          # dependency. So each frozen crate is compared on its **effective package inputs**:
          # cargo's own resolved view of that one package, normalised of absolute paths and ids.
          #
          # `cargo metadata --no-deps` is what makes this runnable on a pull request — it reads
          # manifests, runs no resolver and contacts no registry, so it works at a tag whose
          # sibling crates' *current* versions are not published yet. `cargo package` (the other
          # way to see resolved inherited fields) resolves siblings from crates.io and fails for
          # exactly that reason, which is why ADR 0034 rejects it as a gate.
          # shellcheck disable=SC2016  # `$p` is a jq variable, not a shell one.
          norm_jq='
            def dep_norm:
              { name, rename, req, kind: (.kind // "normal"), optional, uses_default_features,
                features: (.features | unique), target, registry, source };
            .packages[] | select(.name == $p)
            | { name, version, edition, rust_version, license, license_file, links, publish,
                default_run, description, documentation, homepage, readme, repository, authors,
                categories, keywords,
                features: (.features | map_values(unique)),
                dependencies: ([.dependencies[] | dep_norm]
                               | sort_by([.name, (.rename // ""), .kind, (.target // "")])) }'

          # `[workspace.lints]` is inherited into the published manifest but is invisible to
          # `cargo metadata`, so it is the one part compared textually — and only for a crate that
          # actually writes `[lints] workspace = true`, so a lint change never freezes a crate
          # that does not inherit it.
          lints_block() {
            awk '/^\[workspace\.lints/ { p = 1 } p && /^\[/ && !/^\[workspace\.lints/ { p = 0 } p' "$1"
          }
          inherits_lints() {
            awk '/^\[lints\]/ { p = 1; next } /^\[/ { p = 0 }
                 p && /^[[:space:]]*workspace[[:space:]]*=[[:space:]]*true/ { f = 1 }
                 END { exit !f }' "$1"
          }
          # $1 = checkout root, $2 = package, $3 = crate dir (relative), $4 = output file
          effective_inputs() {
            local at=$1 pkg=$2 reldir=$3 out=$4 meta record
            # Assigned before it is piped: inside a pipeline `set -e` would not stop a failing
            # `cargo metadata`, and an empty record must fail loudly rather than compare equal.
            meta=$( cd "$at" && cargo metadata --no-deps --format-version 1 )
            record=$(printf '%s' "$meta" | jq -S --arg p "$pkg" "$norm_jq")
            if [ -z "$record" ]; then
              echo "::error::$pkg is not a workspace member at $at; the freeze check cannot compare it"
              exit 1
            fi
            printf '%s\n' "$record" > "$out"
            if inherits_lints "$at/$reldir/Cargo.toml"; then
              lints_block "$at/Cargo.toml" >> "$out"
            fi
          }

          # Assigned before it is piped, for the same reason. `publish = false` appears as an
          # empty array; a publishable package has `null`.
          metadata=$(cargo metadata --no-deps --format-version 1)
          members=$(printf '%s' "$metadata" | jq -r '
            .packages[] | select(.publish != [])
            | [.name, .version, (.manifest_path | sub("/Cargo.toml$"; ""))] | @tsv')
          if [ -z "$members" ]; then
            echo "::error::no publishable workspace member found; this gate would pass having checked nothing"
            exit 1
          fi
          checked=0
          violations=0
          while IFS=$'\t' read -r name version dir; do
            [ -n "$name" ] || continue
            checked=$((checked + 1))
            dir=${dir#"$GITHUB_WORKSPACE/"}
            body=$(mktemp)
            code=$(curl -sS -H "User-Agent: $ua" -o "$body" -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$name")
            case "$code" in
              404)
                echo "$name $version — not on crates.io; its first publish is unconstrained"
                continue
                ;;
              200) ;;
              *)
                echo "::error::crates.io returned HTTP $code for $name; the freeze check cannot run"
                exit 1
                ;;
            esac
            published=$(jq -r '.versions[].num' "$body")
            if printf '%s\n' "$published" | grep -qx -- "$version"; then
              tag="$name-v$version"
              if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "::error::$name $version is on crates.io but tag $tag does not exist here; the freeze check has nothing to compare against"
                exit 1
              fi
              changed=0
              if ! git diff --quiet "$tag" HEAD -- "$dir"; then
                git diff --stat "$tag" HEAD -- "$dir"
                changed=1
              fi
              worktree="$RUNNER_TEMP/freeze/$name"
              rm -rf "$worktree"
              git worktree add --detach --quiet "$worktree" "refs/tags/$tag"
              effective_inputs "$worktree" "$name" "$dir" "$RUNNER_TEMP/$name.at-tag"
              effective_inputs . "$name" "$dir" "$RUNNER_TEMP/$name.at-head"
              git worktree remove --force "$worktree"
              if ! diff -u --label "$tag" "$RUNNER_TEMP/$name.at-tag" \
                          --label HEAD "$RUNNER_TEMP/$name.at-head"; then
                changed=1
              fi
              if [ "$changed" -ne 0 ]; then
                echo "::error::$name $version is already on crates.io, and what it would publish has changed since $tag (its directory, or a field it inherits from the root manifest). Bump it — minor if the public surface changed, patch otherwise — together with its version pin in the root [workspace.dependencies], the versions of the workspace crates that depend on it, and CHANGELOG.md (ADR 0034)."
                violations=$((violations + 1))
              else
                echo "$name $version is published and unchanged since $tag"
              fi
            else
              echo "$name $version is not published yet — release candidate"
            fi
            # Highest published version = the semver baseline for the next step. Written for every
            # published crate, including the frozen ones, so a crate is enrolled in semver-checks
            # by its first publish and never by editing this workflow.
            baseline=$(printf '%s\n' "$published" | sort -V | tail -1)
            printf '%s\t%s\n' "$name" "$baseline" >> "$baselines"
          done <<< "$members"
          if [ "$violations" -ne 0 ]; then
            exit 1
          fi
          echo "publishable crates checked: $checked"
      - name: cargo semver-checks against the published baseline
        run: |
          set -euo pipefail
          baselines="$RUNNER_TEMP/semver-baselines.tsv"
          if [ ! -s "$baselines" ]; then
            echo "nothing published yet — no baseline to check against"
            exit 0
          fi
          while IFS=$'\t' read -r name baseline; do
            [ -n "$name" ] || continue
            echo "::group::$name vs $baseline"
            cargo semver-checks check-release -p "$name" --baseline-version "$baseline" --all-features
            echo "::endgroup::"
          done < "$baselines"
