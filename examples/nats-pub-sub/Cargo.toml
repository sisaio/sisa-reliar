[package]
name = "nats-pub-sub"
version = "0.0.0"
publish = false
edition.workspace = true
# Overrides the workspace floor (1.88), mirroring `examples/axum-outbox`: this example depends on
# `reliar-store-postgres`, which declares `rust-version = "1.94"` because `sqlx` 0.9 requires it
# (ADR 0025).
rust-version = "1.94"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reliar-core = { workspace = true, features = ["json"] }
reliar-outbox = { workspace = true }
reliar-store-postgres = { workspace = true, features = ["json"] }
reliar-transport-nats = { workspace = true }
async-nats = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# `async_nats::Subscriber` implements `futures_util::Stream`; this crate has no other need for
# the wider `futures` facade, so the lean sub-crate is enough for `StreamExt::next`.
futures-util = { workspace = true }
